name: tsar-bot-keepalive

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'  # каждые 5 минут

permissions:
  contents: read

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install aiogram==3.13.1 httpx==0.27.0 pydantic==2.9.0 fastapi==0.115.0

      - name: Run bot (auto-restart on crash)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          P2P_API_KEY: ${{ secrets.P2P_API_KEY }}
        run: |
          cd $GITHUB_WORKSPACE
          PYTHONPATH=src while true; do
            echo "[$(date)] starting bot..."
            python -m bot.main 2>&1 | tee -a bot.log || echo "[$(date)] bot crashed, restarting in 3s"
            sleep 3
          done
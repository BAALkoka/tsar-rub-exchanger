name: tsar-bot-smoke-test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/bot/**"
      - "bot.py"
      - "scripts/**"

permissions:
  contents:
    read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install aiogram==3.13.1 httpx==0.27.0 pydantic==2.9.0 fastapi==0.115.0

      - name: Import bot handlers
        run: python scripts/smoke_import.py

      - name: Smoke Telegram API
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: python scripts/smoke_telegram.py
